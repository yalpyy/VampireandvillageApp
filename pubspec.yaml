name: vampire_party_game
description: A single-device offline party game inspired by Vampire/Werewolf.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_mobile_ads: ^4.0.0
  in_app_purchase: ^3.1.13
  audioplayers: ^5.2.1
  intl: ^0.18.1
  crypto: ^3.0.3
  app_tracking_transparency: ^2.0.6
  url_launcher: ^6.2.5
  package_info_plus: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

